user nginx;
worker_processes auto;  # автоматический расчет кол-во рабочих процессов
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;  # хватает для этой задачи
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Стандартный лог формат
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Определяем backend - docker compose создает DNS на имя сервиса
    upstream backend {
        server backend:8080;
    }

    # HTTP сервер на порту 80
    server {
        listen 80;
        server_name _;

        # Проксируем все запросы на backend
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            
            # Передаем клиентские данные для логирования
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Connection settings
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
